services:
  spark:
    image: quay.io/jupyter/pyspark-notebook:spark-3.5.0
    ports:
      - "8888:8888"
      - "4040:4040"      # interfaz de Spark
    volumes:
      - .:/home/jovyan/work
    environment:
      - JUPYTER_ENABLE_LAB=yes
    command: >
      start-notebook.sh --NotebookApp.token=''
    deploy:
      resources:
        limits:
          memory: 12G